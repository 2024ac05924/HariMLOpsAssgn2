name: CI - Test and Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-api.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Pull DVC artifacts
        run: |
          dvc pull

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests -v

      - name: Build Docker image
        run: |
          docker build -t harimlopsassgn2-api:ci .

      - name: Authenticate Docker to Artifact Registry
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Tag and push Docker image
        run: |
          IMAGE="asia-south1-docker.pkg.dev/famous-hull-499314-j5/harimlopsassgn2/harimlopsassgn2-api:${{ github.sha }}"
          docker tag harimlopsassgn2-api:ci "$IMAGE"
          docker push "$IMAGE"